<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>FitForge – Workout Planner</title>
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <style>
      :root {
        color-scheme: dark;
        box-sizing: border-box;
        padding-top: env(safe-area-inset-top, 0px);
        padding-bottom: env(safe-area-inset-bottom, 0px);
        --bg: #0b0d12;
        --card: #141821;
        --card2: #1b2130;
        --line: #252c3d;
        --tx: #e8ecf4;
        --mut: #8e98ad;
        --ac: #ff6b35;
        --ac2: #ffb347;
      }
      html {
        scroll-padding-top: env(safe-area-inset-top, 0px);
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--tx);
        font:
          15px/1.55 Inter,
          system-ui,
          -apple-system,
          Segoe UI,
          sans-serif;
      }
      header {
        position: sticky;
        top: env(safe-area-inset-top, 0px);
        z-index: 5;
        background: #0b0d12ee;
        backdrop-filter: blur(10px);
        border-bottom: 1px solid var(--line);
      }
      .bar {
        max-width: 1100px;
        margin: auto;
        padding: 10px 16px;
        display: flex;
        align-items: center;
        gap: 14px;
        flex-wrap: wrap;
      }
      .logo {
        font-weight: 800;
        font-size: 20px;
        letter-spacing: 0.5px;
      }
      .logo b {
        color: var(--ac);
      }
      nav {
        display: flex;
        gap: 4px;
        overflow-x: auto;
        margin-left: auto;
      }
      nav button {
        background: none;
        border: 0;
        color: var(--mut);
        padding: 8px 12px;
        border-radius: 8px;
        font: inherit;
        cursor: pointer;
        white-space: nowrap;
      }
      nav button.on,
      nav button:hover {
        background: var(--card2);
        color: var(--tx);
      }
      nav button.on {
        color: var(--ac2);
      }
      main {
        max-width: 1100px;
        margin: auto;
        padding: 20px 16px 60px;
      }
      h1 {
        font-size: 28px;
        margin: 0 0 4px;
      }
      h2 {
        font-size: 19px;
        margin: 26px 0 12px;
      }
      h3 {
        margin: 0;
        font-size: 16px;
      }
      .mut {
        color: var(--mut);
      }
      .grid {
        display: grid;
        gap: 14px;
        grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
      }
      .card {
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 14px;
        padding: 16px;
      }
      .hero {
        background: linear-gradient(120deg, #2a1608, #141821 60%);
        border: 1px solid #3a2a1c;
        border-radius: 16px;
        padding: 22px;
      }
      .quote {
        font-size: 18px;
        font-style: italic;
        line-height: 1.5;
      }
      .quote small {
        display: block;
        margin-top: 8px;
        font-style: normal;
        color: var(--ac2);
        font-size: 13px;
      }
      .stat b {
        display: block;
        font-size: 26px;
        color: var(--ac2);
      }
      .week {
        display: grid;
        grid-template-columns: repeat(7, 1fr);
        gap: 6px;
      }
      .wd {
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 10px;
        padding: 8px 4px;
        text-align: center;
        font-size: 12px;
        cursor: pointer;
      }
      .wd.t {
        border-color: var(--ac);
        background: #2a1608;
      }
      .wd b {
        display: block;
        font-size: 13px;
      }
      .btn {
        background: var(--ac);
        color: #fff;
        border: 0;
        border-radius: 9px;
        padding: 9px 16px;
        font: inherit;
        font-weight: 600;
        cursor: pointer;
      }
      .btn.g {
        background: var(--card2);
        color: var(--tx);
        border: 1px solid var(--line);
      }
      .btn.sm {
        padding: 5px 10px;
        font-size: 13px;
      }
      input,
      select,
      textarea {
        background: var(--card2);
        color: var(--tx);
        border: 1px solid var(--line);
        border-radius: 9px;
        padding: 9px 11px;
        font: inherit;
        width: 100%;
      }
      textarea {
        min-height: 110px;
        font-family: ui-monospace, Menlo, monospace;
        font-size: 13px;
      }
      .row {
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
        align-items: center;
      }
      .row > * {
        flex: 1 1 140px;
      }
      .sec {
        margin: 18px 0 8px;
        color: var(--ac2);
        font-weight: 700;
        text-transform: uppercase;
        font-size: 12px;
        letter-spacing: 1.2px;
      }
      .ex {
        display: flex;
        gap: 12px;
        align-items: center;
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 12px;
        padding: 8px;
        margin-bottom: 8px;
      }
      .ex.done {
        opacity: 0.5;
      }
      .ex .art {
        width: 64px;
        height: 64px;
        flex: none;
        font-size: 28px;
      }
      .ex > div {
        flex: 1;
        min-width: 0;
      }
      .ex input[type="checkbox"] {
        width: 20px;
        height: 20px;
        flex: none;
        accent-color: var(--ac);
      }
      .art {
        border-radius: 10px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 60px;
        aspect-ratio: 16/10;
        position: relative;
        overflow: hidden;
      }
      .art:after {
        content: "";
        position: absolute;
        inset: 0;
        background: radial-gradient(
          circle at 30% 20%,
          #ffffff33,
          transparent 55%
        );
      }
      .det {
        font-size: 13px;
        color: var(--mut);
        margin-top: 6px;
      }
      .chips {
        display: flex;
        gap: 6px;
        flex-wrap: wrap;
        margin: 12px 0;
      }
      .chip {
        padding: 5px 12px;
        border-radius: 99px;
        background: var(--card2);
        border: 1px solid var(--line);
        cursor: pointer;
        font-size: 13px;
        color: var(--mut);
      }
      .chip.on {
        background: var(--ac);
        color: #fff;
        border-color: var(--ac);
      }
      .tag {
        display: inline-block;
        font-size: 11px;
        padding: 2px 8px;
        border-radius: 99px;
        background: var(--card2);
        color: var(--ac2);
        border: 1px solid var(--line);
      }
      table {
        width: 100%;
        border-collapse: collapse;
        font-size: 14px;
      }
      td,
      th {
        padding: 7px 8px;
        border-bottom: 1px solid var(--line);
        text-align: left;
      }
      .sc {
        overflow-x: auto;
      }
      details summary {
        cursor: pointer;
        padding: 6px 0;
      }
      footer {
        text-align: center;
        color: var(--mut);
        font-size: 12px;
        padding: 20px;
      }
      @media (max-width: 600px) {
        h1 {
          font-size: 23px;
        }
        nav {
          margin-left: 0;
          width: 100%;
        }
        .ex .art {
          width: 52px;
          height: 52px;
        }
      }
    </style>
  </head>

                      "Seated cable row|4x10",
                      "Dumbbell curl|4x10",
                      "Plank|3x60 s"
                    ]
                  }
                ]
              },
              "Saturday": {
                "title": "Legs & Cardio",
                "sections": [
                  {
                    "n": "Main",
                    "items": [
                      "Lunges|4x12/leg",
                      "Leg press|4x15",
                      "Calf raise|4x20",
                      "Cardio|20 min"
                    ]
                  }
                ]
              },
              "Sunday": { "title": "Rest Day", "rest": true, "sections": [] }
            }
          }
        ]
      }
    </script>
    <script>
      const D = JSON.parse(document.getElementById("data").textContent);
      const DAYS = [
        "Monday",
        "Tuesday",
        "Wednesday",
        "Thursday",
        "Friday",
        "Saturday",
        "Sunday",
      ];
      const S = {
        get(k, d) {
          try {
            const v = localStorage.getItem(k);
            return v ? JSON.parse(v) : d;
          } catch (e) {
            return d;
          }
        },
        set(k, v) {
          try {
            localStorage.setItem(k, JSON.stringify(v));
          } catch (e) {}
        },
      };
      const $ = (id) => document.getElementById(id),
        esc = (s) =>
          String(s).replace(
            /[&<>"]/g,
            (c) =>
              ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c],
          );
      const todayName = () => DAYS[(new Date().getDay() + 6) % 7],
        iso = () => new Date().toISOString().slice(0, 10);
      const all = () => [...D.routines, ...S.get("fw_custom", [])];
      const active = () =>
        all().find((r) => r.id === S.get("fw_active", "classic")) ||
        D.routines[0];
      const info = (n) =>
        D.exercises[n] || [
          "Other",
          "Custom exercise. Follow the sets and reps listed in your routine.",
        ];
      const art = (g, x = "") => {
        const c = D.groups[g] || D.groups.Other;
        return `<div class="art" style="background:linear-gradient(135deg,${c[0]},${c[1]})"><span>${c[2]}</span></div>`;
      };
      const quote = (i) => {
        const q =
          D.quotes[
            (i ?? Math.floor(Math.random() * D.quotes.length)) % D.quotes.length
          ];
        return `<div class="quote">“${esc(q[0])}”<small>— ${esc(q[1])}</small></div>`;
      };
      const doneKey = () => "fw_done_" + iso();
      let view = "dash",
        filter = "All",
        q = "",
        selDay = null,
        series = "Body weight";
      const V = {
        dash: "Dashboard",
        today: "Today",
        routines: "Routines",
        lib: "Exercises",
        prog: "Progress",
        build: "Builder",
      };
      $("nav").innerHTML = Object.entries(V)
        .map(
          ([k, v]) =>
            `<button data-v="${k}" onclick="go('${k}')">${v}</button>`,
        )
        .join("");
      function go(v) {
        view = v;
        selDay = null;
        render();
        scrollTo(0, 0);
      }
      function dayHTML(r, dn, track) {
        const d = r.days[dn];
        if (!d) return '<p class="mut">No workout planned.</p>';
        if (d.rest)
          return `<div class="card"><h3>😴 Rest Day</h3><p class="mut">Recovery is where growth happens. Hydrate, sleep well and stretch lightly.</p></div>`;
        const done = S.get(doneKey(), []);
        let n = 0;
        return (d.sections || [])
          .map(
            (s) =>
              `<div class="sec">${esc(s.n)}</div>` +
              s.items
                .map((it) => {
                  const [nm, det] = it.split("|"),
                    e = info(nm),
                    id = dn + "|" + nm + n++,
                    ck = done.includes(id);
                  return `<div class="ex ${track && ck ? "done" : ""}">${track ? `<input type="checkbox" ${ck ? "checked" : ""} onchange="tick('${esc(id)}')">` : ""}${art(e[0])}<div><b>${esc(nm)}</b> <span class="tag">${e[0]}</span><div class="det">${esc(det || "")}</div><details><summary class="mut" style="font-size:13px">How to</summary><div class="det">${esc(e[1])}</div></details></div></div>`;
                })
                .join(""),
          )
          .join("");
      }
      function tick(id) {
        let d = S.get(doneKey(), []);
        d = d.includes(id) ? d.filter((x) => x !== id) : [...d, id];
        S.set(doneKey(), d);
        render();
      }
      function total(r, dn) {
        const d = r.days[dn];
        return d && !d.rest
          ? d.sections.reduce((a, s) => a + s.items.length, 0)
          : 0;
      }
      const R = {
        dash() {
          const r = active(),
            t = todayName(),
            d = r.days[t] || { title: "—" },
            done = S.get(doneKey(), []).length,
            tot = total(r, t),
            logs = S.get("fw_logs", [])
              .filter((l) => l.s === "Body weight")
              .sort((a, b) => (a.d < b.d ? -1 : 1)),
            last = logs[logs.length - 1];
          return `<div class="hero"><div class="mut">${t} · ${new Date().toLocaleDateString(undefined, { day: "numeric", month: "long", year: "numeric" })}</div><h1>Today: ${esc(d.title)}</h1><p class="mut">Active plan: ${esc(r.name)}</p><button class="btn" onclick="go('today')">Start workout →</button></div>
 <h2>This week</h2><div class="week">${DAYS.map((x) => `<div class="wd ${x === t ? "t" : ""}" onclick="selDay='${x}';go('routines')"><b>${x.slice(0, 3)}</b>${esc((r.days[x] || {}).title || "—").split(" ")[0]}</div>`).join("")}</div>
 <h2>Overview</h2><div class="grid"><div class="card stat"><span class="mut">Exercises done today</span><b>${done}/${tot}</b></div><div class="card stat"><span class="mut">Latest body weight</span><b>${last ? last.v + " kg" : "—"}</b></div><div class="card stat"><span class="mut">Routines available</span><b>${all().length}</b></div><div class="card stat"><span class="mut">Weight entries</span><b>${S.get("fw_logs", []).length}</b></div></div>
 <h2>Daily motivation</h2><div class="card">${quote()}<button class="btn g sm" style="margin-top:12px" onclick="render()">Another quote</button></div>`;
        },
        today() {
          const r = active(),
            t = todayName();
          return `<h1>Today’s workout</h1><p class="mut">${t} · ${esc(r.days[t]?.title || "")} · ${esc(r.name)}</p><div class="card" style="margin:14px 0">${quote(new Date().getDate())}</div>${dayHTML(r, t, true)}`;
        },
        routines() {
          const a = active(),
            sel = selDay || todayName();
          return `<h1>Workout routines</h1><p class="mut">Pick a plan to make it your active routine.</p><div class="grid" style="margin-top:14px">${all()
            .map(
              (r) =>
                `<div class="card"><span class="tag">${esc(r.level || "Custom")}</span> ${r.id === a.id ? '<span class="tag" style="color:#6ee7a0">Active</span>' : ""}<h3 style="margin:8px 0 4px">${esc(r.name)}</h3><div class="mut" style="font-size:13px">${esc(r.desc || "")}</div><div class="row" style="margin-top:12px"><button class="btn sm" onclick="setA('${r.id}')">Use this plan</button>${String(r.id).startsWith("c_") ? `<button class="btn g sm" onclick="delR('${r.id}')">Delete</button>` : ""}</div></div>`,
            )
            .join("")}</div>
 <h2>${esc(a.name)} — weekly view</h2><div class="chips">${DAYS.map((x) => `<span class="chip ${x === sel ? "on" : ""}" onclick="selDay='${x}';render()">${x.slice(0, 3)}</span>`).join("")}</div><h3>${sel}: ${esc(a.days[sel]?.title || "Rest")}</h3>${dayHTML(a, sel, false)}`;
        },
        lib() {
          const gs = [
              "All",
              ...Object.keys(D.groups).filter((g) => g !== "Other"),
            ],
            es = Object.entries(D.exercises).filter(
              ([n, e]) =>
                (filter === "All" || e[0] === filter) &&
                n.toLowerCase().includes(q.toLowerCase()),
            );
          return `<h1>Exercise library</h1><p class="mut">Browse movements with descriptions and form cues.</p><input placeholder="Search exercises…" value="${esc(q)}" oninput="q=this.value;render(1)" style="margin-top:12px"><div class="chips">${gs.map((g) => `<span class="chip ${g === filter ? "on" : ""}" onclick="filter='${g}';render()">${g}</span>`).join("")}</div><div class="grid">${es.map(([n, e]) => `<div class="card" style="padding:10px">${art(e[0])}<h3 style="margin:10px 0 4px">${esc(n)}</h3><span class="tag">${e[0]}</span><p class="mut" style="font-size:13px;margin:8px 0 0">${esc(e[1])}</p></div>`).join("") || '<p class="mut">No exercises found.</p>'}</div>`;
        },
        prog() {
          const logs = S.get("fw_logs", []),
            names = [...new Set(logs.map((l) => l.s))];
          if (!names.includes(series)) names.unshift(series);
          const pts = logs
              .filter((l) => l.s === series)
              .sort((a, b) => (a.d < b.d ? -1 : 1)),
            vs = pts.map((p) => p.v),
            mn = Math.min(...vs),
            mx = Math.max(...vs),
            rg = mx - mn || 1;
          const P = pts.map((p, i) => [
            pts.length > 1 ? 30 + i * (540 / (pts.length - 1)) : 300,
            160 - ((p.v - mn) / rg) * 120,
          ]);
          const delta =
            pts.length > 1 ? (vs[vs.length - 1] - vs[0]).toFixed(1) : null;
          return `<h1>Progress tracker</h1><p class="mut">Log body weight or lifts (kg) every day and compare over time.</p>
 <div class="card" style="margin:14px 0"><div class="row"><input id="ls" list="dl" value="Body weight" placeholder="Body weight or exercise"><input id="ld" type="date" value="${iso()}"><input id="lv" type="number" step="0.1" placeholder="Weight (kg)"><button class="btn" onclick="addLog()">Add entry</button></div><datalist id="dl">${["Body weight", ...Object.keys(D.exercises)].map((n) => `<option value="${esc(n)}">`).join("")}</datalist></div>
 <div class="card"><div class="row"><select onchange="series=this.value;render()">${names.map((n) => `<option ${n === series ? "selected" : ""}>${esc(n)}</option>`).join("")}</select>${delta !== null ? `<b style="flex:2;color:${delta <= 0 ? "#6ee7a0" : "var(--ac2)"}">Change since first entry: ${delta > 0 ? "+" : ""}${delta} kg</b>` : '<span class="mut" style="flex:2">Add 2+ entries to see a trend.</span>'}</div>
 ${pts.length ? `<div class="sc"><svg viewBox="0 0 600 190" style="width:100%;min-width:420px;margin-top:10px"><polyline fill="none" stroke="#ff6b35" stroke-width="3" points="${P.map((p) => p.join(",")).join(" ")}"/>${P.map((p, i) => `<circle cx="${p[0]}" cy="${p[1]}" r="4.5" fill="#ffb347"/><text x="${p[0]}" y="${p[1] - 10}" fill="#e8ecf4" font-size="11" text-anchor="middle">${vs[i]}</text><text x="${p[0]}" y="184" fill="#8e98ad" font-size="10" text-anchor="middle">${pts[i].d.slice(5)}</text>`).join("")}</svg></div>` : '<p class="mut">No entries yet for this series.</p>'}</div>
 <h2>History</h2><div class="card sc"><table><tr><th>Date</th><th>Series</th><th>kg</th><th></th></tr>${
   [...logs]
     .map((l, i) => [l, i])
     .sort((a, b) => (a[0].d < b[0].d ? 1 : -1))
     .slice(0, 30)
     .map(
       ([l, i]) =>
         `<tr><td>${l.d}</td><td>${esc(l.s)}</td><td>${l.v}</td><td><button class="btn g sm" onclick="delL(${i})">✕</button></td></tr>`,
     )
     .join("") || '<tr><td colspan=4 class="mut">Nothing logged.</td></tr>'
 }</table></div>`;
        },
        build() {
          const c = S.get("fw_custom", []);
          return `<h1>Routine builder</h1><p class="mut">Create unlimited custom routines. Write a day’s title, then one exercise per line as <code>Name | sets x reps</code>. Start a new section with <code># Section name</code>.</p>
 <div class="card" style="margin:14px 0"><div class="row"><input id="bn" placeholder="Routine name (e.g. My Summer Cut)"><input id="bd" placeholder="Short description"></div>
 ${DAYS.map((x, i) => `<details ${i == 0 ? "open" : ""}><summary><b>${x}</b></summary><input id="t${i}" placeholder="Day title or 'Rest Day'" value="${i == 0 ? "Back & Biceps" : ""}"><textarea id="x${i}" placeholder="# Warm-up&#10;Treadmill | 2 min&#10;# Back&#10;Lat pull-down | 3x8-12">${i == 0 ? "# Back\nLat pull-down | 3x8-12\nSeated cable row | 3x8-12\n# Biceps\nDumbbell curl | 3x10" : ""}</textarea></details>`).join("")}
 <button class="btn" style="margin-top:12px" onclick="saveR()">Save routine</button></div>
 <h2>Your custom routines (${c.length})</h2><div class="grid">${c.map((r) => `<div class="card"><h3>${esc(r.name)}</h3><p class="mut" style="font-size:13px">${esc(r.desc || "")}</p><div class="row"><button class="btn sm" onclick="setA('${r.id}')">Use</button><button class="btn g sm" onclick="delR('${r.id}')">Delete</button></div></div>`).join("") || '<p class="mut">None yet.</p>'}</div>
 <h2>JSON import / export</h2><div class="card"><p class="mut" style="margin-top:0">All routines live in a JSON structure (see the <code>data</code> block in this page’s source). Copy your custom routines below to back up, or paste JSON to import.</p><textarea id="js" style="min-height:140px">${esc(JSON.stringify(c, null, 1))}</textarea><div class="row" style="margin-top:10px"><button class="btn g" onclick="impJ()">Import JSON</button></div></div>`;
        },
      };
      function render(keep) {
        const f =
          keep &&
          document.activeElement &&
          document.activeElement.tagName === "INPUT";
        $("app").innerHTML = R[view]();
        document
          .querySelectorAll("nav button")
          .forEach((b) => b.classList.toggle("on", b.dataset.v === view));
        if (f) {
          const i = document.querySelector("#app input");
          i.focus();
          i.setSelectionRange(i.value.length, i.value.length);
        }
      }
      function setA(id) {
        S.set("fw_active", id);
        go("today");
      }
      function delR(id) {
        S.set(
          "fw_custom",
          S.get("fw_custom", []).filter((r) => r.id !== id),
        );
        if (S.get("fw_active") === id) S.set("fw_active", "classic");
        render();
      }
      function addLog() {
        const s = $("ls").value.trim() || "Body weight",
          v = parseFloat($("lv").value);
        if (!v) return;
        const l = S.get("fw_logs", []).filter(
          (x) => !(x.d === $("ld").value && x.s === s),
        );
        l.push({ d: $("ld").value, s, v });
        S.set("fw_logs", l);
        series = s;
        render();
      }
      function delL(i) {
        const l = S.get("fw_logs", []);
        l.splice(i, 1);
        S.set("fw_logs", l);
        render();
      }
      function saveR() {
        const name = $("bn").value.trim();
        if (!name) {
          alert("Please name your routine.");
          return;
        }
        const days = {};
        DAYS.forEach((x, i) => {
          const t = $("t" + i).value.trim() || "Rest Day",
            lines = $("x" + i)
              .value.split("\n")
              .map((s) => s.trim())
              .filter(Boolean),
            secs = [];
          let cur = null;
          lines.forEach((l) => {
            if (l[0] === "#") {
              cur = { n: l.replace(/^#+\s*/, ""), items: [] };
              secs.push(cur);
            } else {
              if (!cur) {
                cur = { n: "Workout", items: [] };
                secs.push(cur);
              }
              cur.items.push(
                l
                  .split("|")
                  .map((s) => s.trim())
                  .join("|"),
              );
            }
          });
          days[x] =
            /rest/i.test(t) && !secs.length
              ? { title: t, rest: true, sections: [] }
              : { title: t, sections: secs };
        });
        const c = S.get("fw_custom", []);
        c.push({
          id: "c_" + Date.now(),
          name,
          level: "Custom",
          desc: $("bd").value,
          days,
        });
        S.set("fw_custom", c);
        render();
      }
      function impJ() {
        try {
          const a = JSON.parse($("js").value);
          if (!Array.isArray(a)) throw 0;
          S.set(
            "fw_custom",
            a.map((r, i) => ({
              ...r,
              id: String(r.id || "").startsWith("c_")
                ? r.id
                : "c_" + Date.now() + i,
            })),
          );
          render();
        } catch (e) {
          alert("Invalid JSON: expected an array of routines.");
        }
      }
      render();
    </script>
  </body>
</html>
