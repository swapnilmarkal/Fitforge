<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>FitForge – Workout Planner</title>
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <style>
      :root {
        color-scheme: dark;
        box-sizing: border-box;
        padding-top: env(safe-area-inset-top, 0px);
        padding-bottom: env(safe-area-inset-bottom, 0px);
        --bg: #0b0d12;
        --card: #141821;
        --card2: #1b2130;
        --line: #252c3d;
        --tx: #e8ecf4;
        --mut: #8e98ad;
        --ac: #ff6b35;
        --ac2: #ffb347;
      }
      html {
        scroll-padding-top: env(safe-area-inset-top, 0px);
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--tx);
        font:
          15px/1.55 Inter,
          system-ui,
          -apple-system,
          Segoe UI,
          sans-serif;
      }
      header {
        position: sticky;
        top: env(safe-area-inset-top, 0px);
        z-index: 5;
        background: #0b0d12ee;
        backdrop-filter: blur(10px);
        border-bottom: 1px solid var(--line);
      }
      .bar {
        max-width: 1100px;
        margin: auto;
        padding: 10px 16px;
        display: flex;
        align-items: center;
        gap: 14px;
        flex-wrap: wrap;
      }
      .logo {
        font-weight: 800;
        font-size: 20px;
        letter-spacing: 0.5px;
      }
      .logo b {
        color: var(--ac);
      }
      nav {
        display: flex;
        gap: 4px;
        overflow-x: auto;
        margin-left: auto;
      }
      nav button {
        background: none;
        border: 0;
        color: var(--mut);
        padding: 8px 12px;
        border-radius: 8px;
        font: inherit;
        cursor: pointer;
        white-space: nowrap;
      }
      nav button.on,
      nav button:hover {
        background: var(--card2);
        color: var(--tx);
      }
      nav button.on {
        color: var(--ac2);
      }
      main {
        max-width: 1100px;
        margin: auto;
        padding: 20px 16px 60px;
      }
      h1 {
        font-size: 28px;
        margin: 0 0 4px;
      }
      h2 {
        font-size: 19px;
        margin: 26px 0 12px;
      }
      h3 {
        margin: 0;
        font-size: 16px;
      }
      .mut {
        color: var(--mut);
      }
      .grid {
        display: grid;
        gap: 14px;
        grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
      }
      .card {
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 14px;
        padding: 16px;
      }
      .hero {
        background: linear-gradient(120deg, #2a1608, #141821 60%);
        border: 1px solid #3a2a1c;
        border-radius: 16px;
        padding: 22px;
      }
      .quote {
        font-size: 18px;
        font-style: italic;
        line-height: 1.5;
      }
      .quote small {
        display: block;
        margin-top: 8px;
        font-style: normal;
        color: var(--ac2);
        font-size: 13px;
      }
      .stat b {
        display: block;
        font-size: 26px;
        color: var(--ac2);
      }
      .week {
        display: grid;
        grid-template-columns: repeat(7, 1fr);
        gap: 6px;
      }
      .wd {
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 10px;
        padding: 8px 4px;
        text-align: center;
        font-size: 12px;
        cursor: pointer;
      }
      .wd.t {
        border-color: var(--ac);
        background: #2a1608;
      }
      .wd b {
        display: block;
        font-size: 13px;
      }
      .btn {
        background: var(--ac);
        color: #fff;
        border: 0;
        border-radius: 9px;
        padding: 9px 16px;
        font: inherit;
        font-weight: 600;
        cursor: pointer;
      }
      .btn.g {
        background: var(--card2);
        color: var(--tx);
        border: 1px solid var(--line);
      }
      .btn.sm {
        padding: 5px 10px;
        font-size: 13px;
      }
      input,
      select,
      textarea {
        background: var(--card2);
        color: var(--tx);
        border: 1px solid var(--line);
        border-radius: 9px;
        padding: 9px 11px;
        font: inherit;
        width: 100%;
      }
      textarea {
        min-height: 110px;
        font-family: ui-monospace, Menlo, monospace;
        font-size: 13px;
      }
      .row {
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
        align-items: center;
      }
      .row > * {
        flex: 1 1 140px;
      }
      .sec {
        margin: 18px 0 8px;
        color: var(--ac2);
        font-weight: 700;
        text-transform: uppercase;
        font-size: 12px;
        letter-spacing: 1.2px;
      }
      .ex {
        display: flex;
        gap: 12px;
        align-items: flex-start;
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 12px;
        padding: 8px;
        margin-bottom: 8px;
      }
      .ex.done {
        opacity: 0.5;
      }
      .ex .art {
        width: 64px;
        height: 64px;
        flex: none;
        font-size: 28px;
      }
      .ex > div {
        flex: 1;
        min-width: 0;
      }
      .ex input[type="checkbox"] {
        width: 20px;
        height: 20px;
        flex: none;
        accent-color: var(--ac);
      }
      .art {
        border-radius: 10px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 60px;
        aspect-ratio: 16/10;
        position: relative;
        overflow: hidden;
      }
      .art:after {
        content: "";
        position: absolute;
        inset: 0;
        background: radial-gradient(
          circle at 30% 20%,
          #ffffff33,
          transparent 55%
        );
      }
      .det {
        font-size: 13px;
        color: var(--mut);
        margin-top: 6px;
      }
      .chips {
        display: flex;
        gap: 6px;
        flex-wrap: wrap;
        margin: 12px 0;
      }
      .chip {
        padding: 5px 12px;
        border-radius: 99px;
        background: var(--card2);
        border: 1px solid var(--line);
        cursor: pointer;
        font-size: 13px;
        color: var(--mut);
      }
      .chip.on {
        background: var(--ac);
        color: #fff;
        border-color: var(--ac);
      }
      .tag {
        display: inline-block;
        font-size: 11px;
        padding: 2px 8px;
        border-radius: 99px;
        background: var(--card2);
        color: var(--ac2);
        border: 1px solid var(--line);
      }
      table {
        width: 100%;
        border-collapse: collapse;
        font-size: 14px;
      }
      td,
      th {
        padding: 7px 8px;
        border-bottom: 1px solid var(--line);
        text-align: left;
      }
      .sc {
        overflow-x: auto;
      }
      details summary {
        cursor: pointer;
        padding: 6px 0;
      }
      .modal {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        background: #000d;
        z-index: 20;
        display: none;
        align-items: center;
        justify-content: center;
        padding: 16px;
      }
      .modal.on {
        display: flex;
      }
      .mbox {
        width: 100%;
        max-width: 820px;
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 14px;
        padding: 14px;
      }
      .mhead {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 10px;
        gap: 10px;
      }
      .vw {
        position: relative;
        padding-top: 56.25%;
        background: #000;
        border-radius: 10px;
        overflow: hidden;
      }
      .vw iframe,
      .vw video {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        border: 0;
      }
      .vb {
        margin-top: 8px;
      }
      .wd.g {
        background: #0f2a1c;
        border-color: #22c55e;
      }
      .wd.r {
        background: #2a1010;
        border-color: #ef4444;
      }
      .wd.n {
        opacity: 0.65;
      }
      .wd {
        font-size: 13px;
      }
      .pill {
        display: inline-block;
        background: var(--card2);
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 3px 9px;
        font-size: 13px;
        margin: 4px 6px 0 0;
      }
      .pill b {
        color: var(--ac2);
      }
      .last {
        font-size: 13px;
        color: var(--mut);
        margin-top: 8px;
      }
      .ok {
        color: #6ee7a0;
        font-size: 13px;
        margin-top: 8px;
      }
      .lg {
        display: flex;
        gap: 6px;
        flex-wrap: wrap;
        align-items: center;
        margin-top: 8px;
      }
      .lg input {
        width: 78px;
        padding: 6px 8px;
      }
      .note {
        background: var(--card);
        border: 1px dashed var(--line);
        border-radius: 12px;
        padding: 12px;
        color: var(--mut);
      }
      .brow {
        display: flex;
        gap: 6px;
        flex-wrap: wrap;
        margin-bottom: 8px;
      }
      .brow input,
      .brow select {
        flex: 1 1 90px;
        width: auto;
      }
      .brow .nm {
        flex: 3 1 170px;
      }
      .fl {
        display: flex;
        flex-direction: column;
        font-size: 11px;
        color: var(--mut);
        gap: 3px;
        flex: 1 1 90px;
      }
      .fl.nm {
        flex: 3 1 170px;
      }
      .brow .fl input,
      .brow .fl select,
      .fl input {
        flex: none;
        width: 100%;
      }
      .num {
        width: 20px;
        color: var(--ac2);
        font-weight: 700;
        align-self: flex-end;
        padding-bottom: 10px;
      }
      .bh {
        margin: 24px 0 10px;
        padding: 9px 12px;
        border-left: 4px solid var(--c);
        background: var(--card2);
        border-radius: 8px;
        font-weight: 700;
        letter-spacing: 0.5px;
      }
      .bh small {
        display: block;
        font-weight: 400;
        color: var(--mut);
        letter-spacing: 0;
      }
      .art img {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
      }
      .m2 {
        max-height: 80vh;
        overflow: auto;
      }
      .ex .art {
        align-self: flex-start;
      }
      .two {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 14px;
      }
      @media (max-width: 700px) {
        .two {
          grid-template-columns: 1fr;
        }
      }
      .dr {
        display: flex;
        justify-content: space-between;
        gap: 8px;
        padding: 7px 0;
        border-bottom: 1px solid var(--line);
        font-size: 14px;
      }
      .dr small {
        display: block;
        color: var(--ac2);
        font-size: 12px;
      }
      .dr i {
        font-style: normal;
        color: #6ee7a0;
        font-weight: 700;
      }
      #modal2 .mbox {
        max-width: 1000px;
      }
      .wk {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(230px, 1fr));
        gap: 10px;
      }
      .wc {
        background: var(--card2);
        border: 1px solid var(--line);
        border-radius: 12px;
        padding: 12px;
      }
      .wc.t {
        border-color: var(--ac);
      }
      .wc.rs {
        opacity: 0.55;
      }
      .wc h4 {
        margin: 0 0 4px;
        font-size: 15px;
      }
      .wc h4 small {
        display: block;
        color: var(--ac2);
        font-size: 11px;
        letter-spacing: 1px;
      }
      .wsec {
        font-size: 11px;
        color: var(--mut);
        text-transform: uppercase;
        letter-spacing: 1px;
        margin: 10px 0 3px;
      }
      .wl {
        list-style: none;
        margin: 0;
        padding: 0;
        font-size: 13px;
      }
      .wl li {
        display: flex;
        justify-content: space-between;
        gap: 8px;
        padding: 3px 0;
        border-bottom: 1px solid var(--line);
      }
      .wl em {
        color: var(--ac2);
        font-style: normal;
        white-space: nowrap;
      }
      body.lock {
        position: fixed;
        left: 0;
        right: 0;
        overflow: hidden;
      }
      .modal {
        overflow: auto;
        overscroll-behavior: contain;
      }
      .m2 {
        overscroll-behavior: contain;
        -webkit-overflow-scrolling: touch;
        max-height: 76vh;
      }
      .jc {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        background: linear-gradient(120deg, #2a1608, #141821);
        border: 1px solid #3a2a1c;
        border-radius: 16px;
        padding: 18px 12px;
      }
      .jc > div {
        flex: 1;
        text-align: center;
        min-width: 0;
      }
      .jc span {
        font-size: 11px;
        letter-spacing: 1.5px;
        color: var(--mut);
      }
      .jc b {
        display: block;
        font-size: 26px;
        margin: 2px 0;
      }
      .jc .arr {
        flex: 0 0 76px;
        font-size: 22px;
        color: var(--ac2);
      }
      .chg {
        font-size: 13px;
        font-weight: 700;
      }
      .er {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 10px 0;
        border-bottom: 1px solid var(--line);
        flex-wrap: wrap;
      }
      @media (max-width: 600px) {
        .jc b {
          font-size: 20px;
        }
        .jc .arr {
          flex-basis: 56px;
        }
      }
      .eg {
        display: grid;
        grid-template-columns: 1.1fr 1fr 1.5fr 40px;
        gap: 8px;
        align-items: center;
        padding: 10px 0;
        border-bottom: 1px solid var(--line);
        font-size: 14px;
      }
      .eg.eh {
        font-size: 11px;
        letter-spacing: 1px;
        text-transform: uppercase;
        color: var(--mut);
        padding-top: 0;
      }
      .eg .pill {
        white-space: nowrap;
      }
      @media (max-width: 420px) {
        .eg {
          grid-template-columns: 1fr 0.9fr 1.4fr 36px;
          font-size: 13px;
          gap: 6px;
        }
        .eg .pill {
          font-size: 11px;
          padding: 2px 6px;
        }
      }
      footer {
        text-align: center;
        color: var(--mut);
        font-size: 12px;
        padding: 20px;
      }
      @media (max-width: 600px) {
        h1 {
          font-size: 23px;
        }
        nav {
          margin-left: 0;
          width: 100%;
        }
        .ex .art {
          width: 52px;
          height: 52px;
        }
      }
    </style>
  </head>
  <body>
    <header>
      <div class="bar">
        <div class="logo">Fit<b>Forge</b></div>
        <nav id="nav"></nav>
      </div>
    </header>
    <main id="app"></main>
    <div
      class="modal"
      id="modal"
      onclick="if (event.target === this) closeV();"
    >
      <div class="mbox">
        <div class="mhead">
          <h3 id="mt"></h3>
          <button class="btn g sm" onclick="closeV()">✕ Close</button>
        </div>
        <div class="vw" id="mv"></div>
      </div>
    </div>
    <div
      class="modal"
      id="modal2"
      onclick="if (event.target === this) closeW();"
    >
      <div class="mbox">
        <div class="mhead">
          <h3 id="mt2"></h3>
          <button class="btn g sm" onclick="closeW()">✕ Close</button>
        </div>
        <div class="m2" id="mw"></div>
      </div>
    </div>
    <footer>FitForge demo · Train with discipline, rest with purpose.</footer>

    <script>
      const D = JSON.parse(document.getElementById("data").textContent);
      const DAYS = [
        "Monday",
        "Tuesday",
        "Wednesday",
        "Thursday",
        "Friday",
        "Saturday",
        "Sunday",
      ];
      const S = {
        get(k, d) {
          try {
            const v = localStorage.getItem(k);
            return v ? JSON.parse(v) : d;
          } catch (e) {
            return d;
          }
        },
        set(k, v) {
          try {
            localStorage.setItem(k, JSON.stringify(v));
          } catch (e) {}
        },
      };
      const $ = (id) => document.getElementById(id),
        esc = (s) =>
          String(s).replace(
            /[&<>"]/g,
            (c) =>
              ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c],
          );
      const todayName = () => DAYS[(new Date().getDay() + 6) % 7],
        iso = (d = new Date()) =>
          d.getFullYear() +
          "-" +
          String(d.getMonth() + 1).padStart(2, "0") +
          "-" +
          String(d.getDate()).padStart(2, "0");
      const all = () => [...D.routines, ...S.get("fw_custom", [])];
      const active = () =>
        all().find((r) => r.id === S.get("fw_active", "classic")) ||
        D.routines[0];
      const allEx = () => ({ ...D.exercises, ...S.get("fw_cx", {}) });
      const info = (n) =>
        allEx()[n] || [
          "Other",
          "Custom exercise. Follow the sets and reps listed in your routine.",
        ];
      const art = (g, x = "") => {
        const c = D.groups[g] || D.groups.Other;
        return `<div class="art" style="background:linear-gradient(135deg,${c[0]},${c[1]})"><span>${c[2]}</span>${x ? `<img src="${esc(x)}" alt="">` : ""}</div>`;
      };
      const quote = (i) => {
        const q =
          D.quotes[
            (i ?? Math.floor(Math.random() * D.quotes.length)) % D.quotes.length
          ];
        return `<div class="quote">“${esc(q[0])}”<small>— ${esc(q[1])}</small></div>`;
      };
      const doneKey = () => "fw_done_" + iso();
      let view = "dash",
        filter = "All",
        q = "",
        selDay = null,
        selR = "",
        series = "Body weight",
        pdate = "";
      const V = {
        dash: "Dashboard",
        today: "Today",
        routines: "Routines",
        lib: "Exercises",
        learn: "Learn",
        prog: "Progress",
        build: "Builder",
      };
      $("nav").innerHTML = Object.entries(V)
        .map(
          ([k, v]) =>
            `<button data-v="${k}" onclick="go('${k}')">${v}</button>`,
        )
        .join("");
      function go(v) {
        view = v;
        if (v !== "routines") selDay = null;
        render();
        scrollTo(0, 0);
      }
      const bm = (b) =>
        b < 18.5
          ? ["Underweight", "#facc15"]
          : b < 25
            ? ["Healthy", "#6ee7a0"]
            : ["High", "#f87171"];
      const bpill = (b) =>
        b
          ? `<span class="pill" style="margin:0;color:${bm(b)[1]};border-color:${bm(b)[1]}"><b style="color:inherit">${b}</b> · ${bm(b)[0]}</span>`
          : "—";
      function dashStats(r) {
        const n = new Date(),
          ix = (n.getDay() + 6) % 7,
          td = iso();
        let miss = 0,
          dn = 0;
        DAYS.forEach((x, i) => {
          const dt = iso(
            new Date(n.getFullYear(), n.getMonth(), n.getDate() - ix + i),
          );
          if (dayDone(dt)) dn++;
          else if (!r.single && !(r.days[x] || {}).rest && dt < td) miss++;
        });
        let nx = "—";
        for (let k = 1; k <= 7; k++) {
          const x = DAYS[(ix + k) % 7],
            d = r.days[x];
          if (d && !d.rest) {
            nx = r.single ? "Any day" : x.slice(0, 3) + " · " + d.title;
            break;
          }
        }
        const L = S.get("fw_logs", [])
            .filter((l) => l.s === "Body weight")
            .sort((a, b) => (a.d < b.d ? -1 : 1))
            .pop(),
          t = (r.days[todayName()] || {}).title || "—";
        const c = (l, v, sub, col, sz) =>
          `<div class="card stat"><span class="mut">${l}</span><b style="${col ? "color:" + col + ";" : ""}${sz ? "font-size:" + sz + "px" : ""}">${v}</b><span class="mut" style="font-size:12px">${sub || ""}</span></div>`;
        return (
          c("Next up", esc(nx), "", 0, 17) +
          c(
            "Body weight",
            L ? L.v + " kg" : "—",
            L ? "Logged " + L.d : "Log it in Progress",
          ) +
          c(
            "BMI",
            L && L.b ? L.b : "—",
            L && L.b ? bm(L.b)[0] : "Save your height in Progress",
            L && L.b ? bm(L.b)[1] : "",
          )
        );
      }
      function cmp() {
        const wl = S.get("fw_wl", {}),
          t = todayName(),
          a = wl[iso(new Date(Date.now() - 7 * 864e5))] || {},
          b = wl[iso()] || {},
          ns = [...new Set([...Object.keys(a), ...Object.keys(b)])],
          tb = Object.keys(b).length,
          hd = tb ? `${t}: last week vs today` : `Last ${t}’s workout`;
        if (!ns.length)
          return `<h2>${hd}</h2><div class="note">Nothing logged last ${t} yet. Log your sets in Today’s workout and they’ll show up here next week so you can compare.</div>`;
        return `<h2>${hd}</h2><div class="card sc"><table><tr><th>Exercise</th><th>Last ${t}</th>${tb ? "<th>Today</th>" : ""}</tr>${ns.map((n) => `<tr><td>${esc(n)}</td><td>${a[n] ? fmt(a[n]) : "—"}</td>${tb ? `<td><b>${b[n] ? fmt(b[n]) : "—"}</b></td>` : ""}</tr>`).join("")}</table></div>`;
      }
      function dcard(lbl, dt, dn, isT) {
        const r = active(),
          d = r.days[dn],
          wl = S.get("fw_wl", {})[dt] || {},
          tk = S.get("fw_done_" + dt, []),
          since = S.get("fw_since", "") || dt,
          done = dayDone(dt);
        const hd = `<div class="mut" style="font-size:12px;text-transform:uppercase;letter-spacing:1px">${lbl} · ${dt.slice(5)}</div>`;
        if (!d)
          return `<div class="card">${hd}<p class="mut">No workout planned.</p></div>`;
        const ttl = `<h3 style="margin:4px 0 8px;font-size:18px">${esc(d.title)}</h3>`;
        if (d.rest)
          return `<div class="card">${hd}${ttl}<p class="mut">😴 Rest day. Recovery is part of the plan.</p></div>`;
        if (!done) {
          const pk = (a) => a[parseInt(dt.slice(8)) % a.length],
            m = isT
              ? pk([
                  "The hardest rep is the first step. Start with just the warm-up and momentum will do the rest.",
                  "Your future self is watching. Show up today and make them proud.",
                  "Set your heart on the work, not the reward. Begin now.",
                ])
              : dt < since
                ? "This was before you began this plan. Your journey starts now, so make today count!"
                : r.single
                  ? "No session logged that day. This workout is open every day, so fit it in whenever you can!"
                  : pk([
                      "You missed this one, and that’s okay. Every champion has off days. What matters is the next one.",
                      "Missed workouts don’t define you; coming back does. Let’s make today count.",
                      "One skipped session won’t change you, but giving up will. Keep going!",
                    ]);
          return `<div class="card" style="border-color:${isT ? "var(--ac)" : "#7f1d1d"}">${hd}${ttl}<p>${isT ? "💪" : "🔥"} ${m}</p>${isT ? `<button class="btn" onclick="go('today')">Start workout →</button>` : ""}</div>`;
        }
        let n = 0;
        const rows = d.sections
          .map(
            (x) =>
              `<div class="sec" style="margin:12px 0 4px">${esc(x.n)}</div>` +
              x.items
                .map((it) => {
                  const nm = it.split("|")[0],
                    id = dn + "|" + nm + ++n,
                    l = wl[nm];
                  return `<div class="dr"><span>${esc(nm)}${l ? `<small>${esc(fmt(l))}</small>` : ""}</span><i>${l || tk.includes(id) ? "✓" : '<span class="mut">○</span>'}</i></div>`;
                })
                .join(""),
          )
          .join("");
        return `<div class="card" style="border-color:#22c55e55">${hd}${ttl}${rows}</div>`;
      }
      function dcards() {
        const n = new Date(),
          t = todayName();
        return `<h2>Workout snapshot</h2><div class="two">${dcard("Last " + t, iso(new Date(n.getFullYear(), n.getMonth(), n.getDate() - 7)), t, 0)}${dcard("Today", iso(), t, 1)}</div>`;
      }
      const dayDone = (dt) =>
        S.get("fw_done_" + dt, []).length > 0 ||
        Object.keys(S.get("fw_wl", {})[dt] || {}).length > 0;
      function wk(r) {
        const n = new Date(),
          ix = (n.getDay() + 6) % 7,
          td = iso(),
          since = S.get("fw_since", "") || (S.set("fw_since", td), td);
        return DAYS.map((x, i) => {
          const dt = iso(
              new Date(n.getFullYear(), n.getMonth(), n.getDate() - ix + i),
            ),
            rs = (r.days[x] || {}).rest,
            dn = dayDone(dt),
            c = dn
              ? "g"
              : rs || r.single
                ? "n"
                : dt < td && dt >= since
                  ? "r"
                  : dt === td
                    ? "t"
                    : "n";
          return `<div class="wd ${c}" onclick="selDay='${x}';go('routines')"><b>${x.slice(0, 3)}</b>${dt.slice(8)}<br>${dn ? "✓" : rs ? "😴" : dt < td && dt >= since && !r.single ? "✗" : "·"}</div>`;
        }).join("");
      }
      const W_MSG =
          "Please warm up nicely before you start. A few minutes of light cardio plus gentle arm and leg swings wakes up your muscles and joints and lowers your risk of injury.",
        S_MSG =
          "Don’t skip the cool-down. Spend 5–10 minutes stretching what you trained, hold each stretch for about 30 seconds and breathe slowly. Your body will thank you tomorrow.";
      const tg = (d) => {
        d = d || "";
        if (!d.trim()) return { t: "s", sets: "", reps: "" };
        let m = d.match(/^(\d+)\s*x\s*(.+)$/i);
        if (m)
          return {
            t: "s",
            sets: m[1],
            reps: m[2]
              .replace("/leg", " each leg")
              .replace("/side", " each side")
              .replace(/max/i, "Max")
              .replace("-", "–"),
          };
        if ((m = d.match(/^(\d+)\s*sets?$/i)))
          return { t: "s", sets: m[1], reps: "" };
        if ((m = d.match(/^(.+?)\s*reps$/i)))
          return { t: "s", sets: "", reps: m[1] };
        return /^\d+(\.\d+)?\s*(min|s)\b/i.test(d) ? { t: "t" } : { t: "n" };
      };
      const fmt = (l) => {
        if (l.m != null) return l.m + " min";
        const a =
          l.sets ||
          (l.s ? Array.from({ length: l.s }, () => ({ w: l.w, r: l.r })) : []);
        return (
          a
            .map((x) =>
              [x.w && x.w + " kg", x.r && x.r + " reps"]
                .filter(Boolean)
                .join(" × "),
            )
            .filter(Boolean)
            .join(" · ") || "Done"
        );
      };
      function lastLog(nm) {
        const wl = S.get("fw_wl", {}),
          cut = iso(new Date(Date.now() - 7 * 864e5)),
          d = Object.keys(wl)
            .filter((x) => x < iso() && x >= cut && wl[x][nm])
            .sort()
            .pop();
        return d ? [d, wl[d][nm]] : null;
      }
      const sr = (k, w, r) =>
        `<div class="sr lg"><span class="mut" style="width:44px">Set ${k}</span><input type="number" step="0.5" placeholder="kg" value="${w}"><span class="mut">×</span><input type="number" placeholder="reps" value="${r}"></div>`;

        const c = $("sr" + N);
        c.insertAdjacentHTML("beforeend", sr(c.children.length + 1, "", ""));
      }

        const d = r.days[dn];

        const done = S.get(doneKey(), []),
          td = S.get("fw_wl", {})[iso()] || {},
          sc = d.sections || [],
          isW = (x) => x.kind === "warm" || /warm/i.test(x.n),
          isS = (x) => x.kind === "stretch" || /stretch/i.test(x.n);

        return (
          (sc.some(isW) ? "" : blk("🔥", "Warm-up", W_MSG)) +
          sc

              const ws = isW(x) || isS(x) || /recover/i.test(x.n);

                `<div class="sec">${esc(x.n)}</div>` +

        [
          "Deltoids",
          "Shoulders",
          "The rounded shoulder muscle, with front, side and rear parts. Used in every pressing and raising move.",
        ],
        [
          "Rear delts",
          "Shoulders",
          "The back of the shoulder. Often neglected; reverse pec deck targets it and helps posture.",
        ],
        [
          "Pecs (Pectorals)",
          "Chest",
          "The chest muscles that push your arms forward and together. Bench press, push-ups and flys.",
        ],
        [
          "Biceps",
          "Biceps",
          "Front of the upper arm. Bends the elbow and turns the palm up.",
        ],
        [
          "Triceps",
          "Triceps",
          "Back of the upper arm. Straightens the elbow and makes up about two-thirds of arm size.",
        ],
        [
          "Core",
          "Core",
          "Abs, obliques and deep trunk muscles that keep your spine stable. Planks train them.",
        ],
        [
          "Set and rep",
          "Other",
          "A rep is one full movement; a set is a group of reps. 3 sets × 10 reps means 10 reps, rest, and repeat 3 times.",
        ],
        [
          "Progressive overload",
          "Other",
          "Gradually adding weight, reps or sets over time so your muscles keep adapting.",
        ],
        [
          "Superset",
          "Other",
          "Two exercises done back to back with no rest in between.",
        ],
        [
          "Warm-up",
          "Mobility",
          "Light movement before training that raises body temperature and prepares your joints.",
        ],
      ];
      function weekHTML(r) {
        const t = todayName();
        return (
          `<div class="wk">` +
          (r.single ? ["Monday"] : DAYS)
            .map((x) => {
              const d = r.days[x] || {};
              return (
                `<div class="wc ${x === t && !r.single ? "t" : ""} ${d.rest ? "rs" : ""}"><h4><small>${r.single ? "WORKOUT" : x.slice(0, 3).toUpperCase()}</small>${esc(d.title || "Rest")}</h4>` +
                (d.rest
                  ? '<div class="mut" style="font-size:13px">😴 Rest day</div>'
                  : (d.sections || [])
                      .map(
                        (c) =>
                          `<div class="wsec">${esc(c.n)}</div><ul class="wl">${c.items
                            .map((i) => {
                              const [a, b] = i.split("|"),
                                g = tg(b);
                              return `<li><span>${esc(a)}</span><em>${g.t === "s" && g.sets && g.reps ? g.sets + " × " + esc(g.reps) : esc(b || "")}</em></li>`;
                            })
                            .join("")}</ul>`,
                      )
                      .join("")) +
                `</div>`
              );
            })
            .join("") +
          `</div>`
        );
      }
      function openW(id) {
        const r = all().find((x) => x.id === id);
        if (!r) return;
        $("mt2").textContent = r.name;
        $("mw").innerHTML = weekHTML(r);
        $("modal2").classList.add("on");
        lock();
      }
      function closeW() {
        $("modal2").classList.remove("on");
        unlock();
      }
      function lock() {
        const b = document.body;
        if (b.classList.contains("lock")) return;
        b.dataset.y = scrollY;
        b.style.top = -scrollY + "px";
        b.classList.add("lock");
      }
      function unlock() {
        const b = document.body;
        if (
          !b.classList.contains("lock") ||
          document.querySelector(".modal.on")
        )
          return;
        b.classList.remove("lock");
        b.style.top = "";
        scrollTo(0, +b.dataset.y || 0);
      }
      document.addEventListener("keydown", (e) => {
        if (e.key === "Escape") closeW();
      });
      const exForm = () =>
        `<details class="card" style="margin:12px 0"><summary><b>+ Add your own exercise</b></summary><div class="row" style="margin-top:12px"><label class="fl nm">Name<input id="xn" placeholder="e.g. Cable crunch"></label><label class="fl">Muscle group<select id="xg">${Object.keys(
          D.groups,
        )
          .map((g) => `<option>${g}</option>`)
          .join(
            "",
          )}</select></label></div><label class="fl" style="margin-top:10px">Description<textarea id="xd" style="min-height:70px" placeholder="How to perform it"></textarea></label><div class="row" style="margin:10px 0"><label class="fl">Thumbnail (optional)<input id="xf" type="file" accept="image/*"></label><label class="fl">Video link (optional)<input id="xv" placeholder="YouTube, Vimeo or .mp4 link"></label></div><p class="mut" style="font-size:12px">No thumbnail? A picture is chosen from the muscle group.</p><button class="btn" onclick="addEx()">Save exercise</button></details>`;
      function addEx() {
        const n = $("xn").value.trim();
        if (!n) {
          alert("Please enter a name.");
          return;
        }
        const f = $("xf").files[0],
          sv = (th) => {
            const c = S.get("fw_cx", {});
            c[n] = [
              $("xg").value,
              $("xd").value.trim() || "Custom exercise.",
              $("xv").value.trim(),
              th || "",
            ];
            S.set("fw_cx", c);
            render();
          };
        if (!f) return sv();
        const rd = new FileReader();
        rd.onload = () => {
          const im = new Image();
          im.onload = () => {
            const k = Math.min(1, 480 / Math.max(im.width, im.height)),
              cv = document.createElement("canvas");
            cv.width = im.width * k;
            cv.height = im.height * k;
            cv.getContext("2d").drawImage(im, 0, 0, cv.width, cv.height);
            sv(cv.toDataURL("image/jpeg", 0.75));
          };
          im.onerror = () => sv();
          im.src = rd.result;
        };
        rd.readAsDataURL(f);
      }
      function delX(n) {
        const c = S.get("fw_cx", {});
        delete c[n];
        S.set("fw_cx", c);
        render();
      }
      function closeV() {
        $("modal").classList.remove("on");
        $("mv").innerHTML = "";
        unlock();
      }
      document.addEventListener("keydown", (e) => {
        if (e.key === "Escape") closeV();
      });
      function bkCard() {
        return `<h2>Backup &amp; transfer</h2><div class="card"><p class="mut" style="margin-top:0">Your data is saved in this browser only. Download a backup to keep it safe or move it to another device, then import it there.</p><div class="row"><button class="btn" onclick="expD()">⬇ Download backup</button><label class="fl">Import a backup file<input type="file" accept=".json,application/json" onchange="impF(this.files[0])"></label></div>
 <details style="margin-top:12px"><summary class="mut">Prefer copy &amp; paste?</summary><textarea id="bk" style="min-height:100px;margin-top:8px"></textarea><div class="row" style="margin-top:8px"><button class="btn g sm" onclick="$('bk').value=bkJSON()">Show my backup</button><button class="btn g sm" onclick="impT($('bk').value)">Import pasted backup</button></div></details></div>`;
      }
      function bkJSON() {
        const d = {};
        try {
          Object.keys(localStorage)
            .filter((k) => k.startsWith("fw_"))
            .forEach((k) => (d[k] = S.get(k, null)));
        } catch (e) {}
        return JSON.stringify({ app: "fitforge", v: 1, saved: iso(), data: d });
      }
      async function expD() {
        let dl = null;
        try {
          dl = window.claude && (await claude.use("downloads"));
        } catch (e) {}
        if (!dl) {
          $("bk").value = bkJSON();
          $("bk").closest("details").open = true;
          alert(
            "Direct download is not available here. Copy the text from the box and save it somewhere safe.",
          );
          return;
        }
        try {
          await dl.save({
            filename: "fitforge-backup-" + iso() + ".json",
            data: bkJSON(),
          });
        } catch (e) {
          if (!e || e.code !== "declined")
            alert(
              "Could not save the file (" +
                ((e && e.message) || "unavailable") +
                "). Use copy & paste instead.",
            );
        }
      }
      function impF(f) {
        if (!f) return;
        const r = new FileReader();
        r.onload = () => impT(r.result);
        r.readAsText(f);
      }
      function impT(t) {
        try {
          const j = JSON.parse(t);
          if (j.app !== "fitforge") throw 0;
          if (!confirm("Merge this backup into the data on this device?"))
            return;
          const d = j.data;
          for (const k in d) {
            if (!k.startsWith("fw_")) continue;
            const v = d[k],
              cur = S.get(k, null);
            let nv = v;
            if (k === "fw_logs" && Array.isArray(cur)) {
              const m = {};
              [...v, ...cur].forEach((x) => (m[x.d + "|" + x.s] = x));
              nv = Object.values(m);
            } else if (k === "fw_custom" && Array.isArray(cur)) {
              const m = {};
              [...v, ...cur].forEach((x) => (m[x.id] = x));
              nv = Object.values(m);
            } else if (k === "fw_wl" && cur) {
              nv = { ...v };
              for (const dd in cur) nv[dd] = { ...(v[dd] || {}), ...cur[dd] };
            } else if (k === "fw_cx" && cur) nv = { ...v, ...cur };
            else if (k.startsWith("fw_done_") && Array.isArray(cur))
              nv = [...new Set([...v, ...cur])];
            else if (cur !== null && typeof v !== "object") nv = cur;
            S.set(k, nv);
          }
          alert("Backup imported!");
          render();
        } catch (e) {
          alert("That does not look like a FitForge backup file.");
        }
      }
      render();
    </script>
  </body>
</html>
