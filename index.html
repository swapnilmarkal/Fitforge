<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>FitForge – Workout Planner</title>
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <style>
      :root {
        color-scheme: dark;
        box-sizing: border-box;
        padding-top: env(safe-area-inset-top, 0px);
        padding-bottom: env(safe-area-inset-bottom, 0px);
        --bg: #0b0d12;
        --card: #141821;
        --card2: #1b2130;
        --line: #252c3d;
        --tx: #e8ecf4;
        --mut: #8e98ad;
        --ac: #ff6b35;
        --ac2: #ffb347;
      }
      html {
        scroll-padding-top: env(safe-area-inset-top, 0px);
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--tx);
        font:
          15px/1.55 Inter,
          system-ui,
          -apple-system,
          Segoe UI,
          sans-serif;
      }
      header {
        position: sticky;
        top: env(safe-area-inset-top, 0px);
        z-index: 5;
        background: #0b0d12ee;
        backdrop-filter: blur(10px);
        border-bottom: 1px solid var(--line);
      }
      .bar {
        max-width: 1100px;
        margin: auto;
        padding: 10px 16px;
        display: flex;
        align-items: center;
        gap: 14px;
        flex-wrap: wrap;
      }
      .logo {
        font-weight: 800;
        font-size: 20px;
        letter-spacing: 0.5px;
      }
      .logo b {
        color: var(--ac);
      }
      nav {
        display: flex;
        gap: 4px;
        overflow-x: auto;
        margin-left: auto;
      }
      nav button {
        background: none;
        border: 0;
        color: var(--mut);
        padding: 8px 12px;
        border-radius: 8px;
        font: inherit;
        cursor: pointer;
        white-space: nowrap;
      }
      nav button.on,
      nav button:hover {
        background: var(--card2);
        color: var(--tx);
      }
      nav button.on {
        color: var(--ac2);
      }
      main {
        max-width: 1100px;
        margin: auto;
        padding: 20px 16px 60px;
      }
      h1 {
        font-size: 28px;
        margin: 0 0 4px;
      }
      h2 {
        font-size: 19px;
        margin: 26px 0 12px;
      }
      h3 {
        margin: 0;
        font-size: 16px;
      }
      .mut {
        color: var(--mut);
      }
      .grid {
        display: grid;
        gap: 14px;
        grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
      }
      .card {
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 14px;
        padding: 16px;
      }
      .hero {
        background: linear-gradient(120deg, #2a1608, #141821 60%);
        border: 1px solid #3a2a1c;
        border-radius: 16px;
        padding: 22px;
      }
      .quote {
        font-size: 18px;
        font-style: italic;
        line-height: 1.5;
      }
      .quote small {
        display: block;
        margin-top: 8px;
        font-style: normal;
        color: var(--ac2);
        font-size: 13px;
      }
      .stat b {
        display: block;
        font-size: 26px;
        color: var(--ac2);
      }
      .week {
        display: grid;
        grid-template-columns: repeat(7, 1fr);
        gap: 6px;
      }
      .wd {
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 10px;
        padding: 8px 4px;
        text-align: center;
        font-size: 12px;
        cursor: pointer;
      }
      .wd.t {
        border-color: var(--ac);
        background: #2a1608;
      }
      .wd b {
        display: block;
        font-size: 13px;
      }
      .btn {
        background: var(--ac);
        color: #fff;
        border: 0;
        border-radius: 9px;
        padding: 9px 16px;
        font: inherit;
        font-weight: 600;
        cursor: pointer;
      }
      .btn.g {
        background: var(--card2);
        color: var(--tx);
        border: 1px solid var(--line);
      }
      .btn.sm {
        padding: 5px 10px;
        font-size: 13px;
      }
      input,
      select,
      textarea {
        background: var(--card2);
        color: var(--tx);
        border: 1px solid var(--line);
        border-radius: 9px;
        padding: 9px 11px;
        font: inherit;
        width: 100%;
      }
      textarea {
        min-height: 110px;
        font-family: ui-monospace, Menlo, monospace;
        font-size: 13px;
      }
      .row {
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
        align-items: center;
      }
      .row > * {
        flex: 1 1 140px;
      }
      .sec {
        margin: 18px 0 8px;
        color: var(--ac2);
        font-weight: 700;
        text-transform: uppercase;
        font-size: 12px;
        letter-spacing: 1.2px;
      }
      .ex {
        display: flex;
        gap: 12px;
        align-items: flex-start;
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 12px;
        padding: 8px;
        margin-bottom: 8px;
      }
      .ex.done {
        opacity: 0.5;
      }
      .ex .art {
        width: 64px;
        height: 64px;
        flex: none;
        font-size: 28px;
      }
      .ex > div {
        flex: 1;
        min-width: 0;
      }
      .ex input[type="checkbox"] {
        width: 20px;
        height: 20px;
        flex: none;
        accent-color: var(--ac);
      }
      .art {
        border-radius: 10px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 60px;
        aspect-ratio: 16/10;
        position: relative;
        overflow: hidden;
      }
      .art:after {
        content: "";
        position: absolute;
        inset: 0;
        background: radial-gradient(
          circle at 30% 20%,
          #ffffff33,
          transparent 55%
        );
      }
      .det {
        font-size: 13px;
        color: var(--mut);
        margin-top: 6px;
      }
      .chips {
        display: flex;
        gap: 6px;
        flex-wrap: wrap;
        margin: 12px 0;
      }
      .chip {
        padding: 5px 12px;
        border-radius: 99px;
        background: var(--card2);
        border: 1px solid var(--line);
        cursor: pointer;
        font-size: 13px;
        color: var(--mut);
      }
      .chip.on {
        background: var(--ac);
        color: #fff;
        border-color: var(--ac);
      }
      .tag {
        display: inline-block;
        font-size: 11px;
        padding: 2px 8px;
        border-radius: 99px;
        background: var(--card2);
        color: var(--ac2);
        border: 1px solid var(--line);
      }
      table {
        width: 100%;
        border-collapse: collapse;
        font-size: 14px;
      }
      td,
      th {
        padding: 7px 8px;
        border-bottom: 1px solid var(--line);
        text-align: left;
      }
      .sc {
        overflow-x: auto;
      }
      details summary {
        cursor: pointer;
        padding: 6px 0;
      }
      .modal {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        background: #000d;
        z-index: 20;
        display: none;
        align-items: center;
        justify-content: center;
        padding: 16px;
      }
      .modal.on {
        display: flex;
      }
      .mbox {
        width: 100%;
        max-width: 820px;
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 14px;
        padding: 14px;
      }
      .mhead {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 10px;
        gap: 10px;
      }
      .vw {
        position: relative;
        padding-top: 56.25%;
        background: #000;
        border-radius: 10px;
        overflow: hidden;
      }
      .vw iframe,
      .vw video {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        border: 0;
      }
      .vb {
        margin-top: 8px;
      }
      .wd.g {
        background: #0f2a1c;
        border-color: #22c55e;
      }
      .wd.r {
        background: #2a1010;
        border-color: #ef4444;
      }
      .wd.n {
        opacity: 0.65;
      }
      .wd {
        font-size: 13px;
      }
      .pill {
        display: inline-block;
        background: var(--card2);
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 3px 9px;
        font-size: 13px;
        margin: 4px 6px 0 0;
      }
      .pill b {
        color: var(--ac2);
      }
      .last {
        font-size: 13px;
        color: var(--mut);
        margin-top: 8px;
      }
      .ok {
        color: #6ee7a0;
        font-size: 13px;
        margin-top: 8px;
      }
      .lg {
        display: flex;
        gap: 6px;
        flex-wrap: wrap;
        align-items: center;
        margin-top: 8px;
      }
      .lg input {
        width: 78px;
        padding: 6px 8px;
      }
      .note {
        background: var(--card);
        border: 1px dashed var(--line);
        border-radius: 12px;
        padding: 12px;
        color: var(--mut);
      }
      .brow {
        display: flex;
        gap: 6px;
        flex-wrap: wrap;
        margin-bottom: 8px;
      }
      .brow input,
      .brow select {
        flex: 1 1 90px;
        width: auto;
      }
      .brow .nm {
        flex: 3 1 170px;
      }
      .fl {
        display: flex;
        flex-direction: column;
        font-size: 11px;
        color: var(--mut);
        gap: 3px;
        flex: 1 1 90px;
      }
      .fl.nm {
        flex: 3 1 170px;
      }
      .brow .fl input,
      .brow .fl select,
      .fl input {
        flex: none;
        width: 100%;
      }
      .num {
        width: 20px;
        color: var(--ac2);
        font-weight: 700;
        align-self: flex-end;
        padding-bottom: 10px;
      }
      .bh {
        margin: 24px 0 10px;
        padding: 9px 12px;
        border-left: 4px solid var(--c);
        background: var(--card2);
        border-radius: 8px;
        font-weight: 700;
        letter-spacing: 0.5px;
      }
      .bh small {
        display: block;
        font-weight: 400;
        color: var(--mut);
        letter-spacing: 0;
      }
      .art img {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
      }
      .m2 {
        max-height: 80vh;
        overflow: auto;
      }
      .ex .art {
        align-self: flex-start;
      }
      .two {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 14px;
      }
      @media (max-width: 700px) {
        .two {
          grid-template-columns: 1fr;
        }
      }
      .dr {
        display: flex;
        justify-content: space-between;
        gap: 8px;
        padding: 7px 0;
        border-bottom: 1px solid var(--line);
        font-size: 14px;
      }
      .dr small {
        display: block;
        color: var(--ac2);
        font-size: 12px;
      }
      .dr i {
        font-style: normal;
        color: #6ee7a0;
        font-weight: 700;
      }
      #modal2 .mbox {
        max-width: 1000px;
      }
      .wk {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(230px, 1fr));
        gap: 10px;
      }
      .wc {
        background: var(--card2);
        border: 1px solid var(--line);
        border-radius: 12px;
        padding: 12px;
      }
      .wc.t {
        border-color: var(--ac);
      }
      .wc.rs {
        opacity: 0.55;
      }
      .wc h4 {
        margin: 0 0 4px;
        font-size: 15px;
      }
      .wc h4 small {
        display: block;
        color: var(--ac2);
        font-size: 11px;
        letter-spacing: 1px;
      }
      .wsec {
        font-size: 11px;
        color: var(--mut);
        text-transform: uppercase;
        letter-spacing: 1px;
        margin: 10px 0 3px;
      }
      .wl {
        list-style: none;
        margin: 0;
        padding: 0;
        font-size: 13px;
      }
      .wl li {
        display: flex;
        justify-content: space-between;
        gap: 8px;
        padding: 3px 0;
        border-bottom: 1px solid var(--line);
      }
      .wl em {
        color: var(--ac2);
        font-style: normal;
        white-space: nowrap;
      }
      body.lock {
        position: fixed;
        left: 0;
        right: 0;
        overflow: hidden;
      }
      .modal {
        overflow: auto;
        overscroll-behavior: contain;
      }
      .m2 {
        overscroll-behavior: contain;
        -webkit-overflow-scrolling: touch;
        max-height: 76vh;
      }
      .jc {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        background: linear-gradient(120deg, #2a1608, #141821);
        border: 1px solid #3a2a1c;
        border-radius: 16px;
        padding: 18px 12px;
      }
      .jc > div {
        flex: 1;
        text-align: center;
        min-width: 0;
      }
      .jc span {
        font-size: 11px;
        letter-spacing: 1.5px;
        color: var(--mut);
      }
      .jc b {
        display: block;
        font-size: 26px;
        margin: 2px 0;
      }
      .jc .arr {
        flex: 0 0 76px;
        font-size: 22px;
        color: var(--ac2);
      }
      .chg {
        font-size: 13px;
        font-weight: 700;
      }
      .er {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 10px 0;
        border-bottom: 1px solid var(--line);
        flex-wrap: wrap;
      }
      @media (max-width: 600px) {
        .jc b {
          font-size: 20px;
        }
        .jc .arr {
          flex-basis: 56px;
        }
      }
      .eg {
        display: grid;
        grid-template-columns: 1.1fr 1fr 1.5fr 40px;
        gap: 8px;
        align-items: center;
        padding: 10px 0;
        border-bottom: 1px solid var(--line);
        font-size: 14px;
      }
      .eg.eh {
        font-size: 11px;
        letter-spacing: 1px;
        text-transform: uppercase;
        color: var(--mut);
        padding-top: 0;
      }
      .eg .pill {
        white-space: nowrap;
      }
      @media (max-width: 420px) {
        .eg {
          grid-template-columns: 1fr 0.9fr 1.4fr 36px;
          font-size: 13px;
          gap: 6px;
        }
        .eg .pill {
          font-size: 11px;
          padding: 2px 6px;
        }
      }
      .gauge {
        position: relative;
        height: 8px;
        border-radius: 99px;
        margin: 12px 0 6px;
        background: linear-gradient(
          90deg,
          #facc15 0 14%,
          #6ee7a0 14% 40%,
          #fb923c 40% 60%,
          #f87171 60%
        );
      }
      .gauge i {
        position: absolute;
        top: -4px;
        width: 4px;
        height: 16px;
        background: #fff;
        border-radius: 2px;
        transform: translateX(-2px);
      }
      .brow .fl input,
      .brow .fl select {
        height: 40px;
      }
      .brow > .xb {
        flex: 0 0 44px;
        height: 40px;
        padding: 0;
        align-self: flex-start;
        margin-top: 20px;
        font-size: 16px;
      }
      .brow > .num {
        align-self: flex-start;
        margin-top: 30px;
        padding: 0;
      }
      .nn {
        font-size: 11px;
        color: var(--ac2);
      }
      .pk {
        margin: 0 0 10px;
      }
      .eg.e3 {
        grid-template-columns: 1fr 1fr 40px;
      }
      .tip {
        border-color: #3a2a1c;
        background: linear-gradient(120deg, #1b1610, #141821);
      }
      footer {
        text-align: center;
        color: var(--mut);
        font-size: 12px;
        padding: 20px;
      }
      @media (max-width: 600px) {
        h1 {
          font-size: 23px;
        }
        nav {
          margin-left: 0;
          width: 100%;
        }
        .ex .art {
          width: 52px;
          height: 52px;
        }
      }
    </style>
  </head>
  <body>
    <header>
      <div class="bar">
        <div class="logo">Fit<b>Forge</b></div>
        <nav id="nav"></nav>
      </div>
    </header>
    <main id="app"></main>
    <div
      class="modal"
      id="modal"
      onclick="if (event.target === this) closeV();"
    >
      <div class="mbox">
        <div class="mhead">
          <h3 id="mt"></h3>
          <button class="btn g sm" onclick="closeV()">✕ Close</button>
        </div>
        <div class="vw" id="mv"></div>
      </div>
    </div>
    <div
      class="modal"
      id="modal2"
      onclick="if (event.target === this) closeW();"
    >
      <div class="mbox">
        <div class="mhead">
          <h3 id="mt2"></h3>
          <button class="btn g sm" onclick="closeW()">✕ Close</button>
        </div>
        <div class="m2" id="mw"></div>
      </div>
    </div>
    <footer>FitForge demo · Train with discipline, rest with purpose.</footer>

    <script>

        get(k, d) {

        const n = new Date(),
          ix = (n.getDay() + 6) % 7,
          td = iso(),
          P = S.get("fw_prof", {}),
          h = S.get("fw_h", 0),
          W = S.get("fw_logs", [])

          L = W[W.length - 1];
        let dn = 0,

          if (
            dayDone(
              iso(
                new Date(n.getFullYear(), n.getMonth(), n.getDate() - ix + i),

          t0 = r.days[todayName()] || {};

        if (!t0.rest && !dayDone(td)) nx = ["Today", esc(t0.title)];
        else {
          const d = r.days[DAYS[(ix + 1) % 7]] || {};

          ? c("Body weight", L.v + " kg", "Logged " + L.d)

          let sub = "Keep logging to see progress";
          if (W.length > 1) {
            const dd = +(L.v - W[0].v).toFixed(1);
            sub = (dd > 0 ? "+" : "") + dd + " kg since you started";
          }
          g = c("Your goal", GOALS[P.goal], sub, 0, 17);

          (nr ? "" : c("Next up", nx[1], nx[0], 0, 17)) +
          wc +
          bmiCard(L, h, +P.age) +
          (nr || r.single
            ? ""

          (nr ? "" : g)

      function bmiCard(L, h, age) {
        const bx = (b) =>
            `<div class="card stat"><span class="mut">BMI</span>${b}</div>`,
          sm = (t) =>
            `<span class="mut" style="font-size:12px;display:block">${t}</span>`;

          );

          return bx(
            `<b>${b}</b>${sm("For under‑18s, BMI is judged on age and sex growth charts, so no label is shown. A doctor can interpret it.")}`,
          );
        const c = bm(b),
          pp = Math.max(0, Math.min(100, ((b - 15) / 25) * 100));
        return bx(
          `<b style="color:${c[1]}">${b}</b><span style="color:${c[1]};font-weight:600;font-size:14px">${c[0]}</span><div class="gauge"><i style="left:${pp}%"></i></div>${sm("Healthy range: 18.5 – 24.9" + (age >= 65 ? ". At 65+, a slightly higher BMI is often fine." : ""))}`,
        );

        const r = isT ? effR() : active(),
          d = r.days[dn],

          since = S.get("fw_since", "") || dt,

        const ttl = `<h3 style="margin:4px 0 8px;font-size:18px">${esc(d.title)}</h3>`;
        if (d.rest)
          return `<div class="card">${hd}${ttl}<p class="mut">😴 Rest day. Recovery is part of the plan.</p></div>`;
        if (!done) {
          const pk = (a) => a[parseInt(dt.slice(8)) % a.length],
            m = isT
              ? pk([
                  "The hardest rep is the first step. Start with just the warm-up and momentum will do the rest.",
                  "Your future self is watching. Show up today and make them proud.",
                  "Set your heart on the work, not the reward. Begin now.",
                ])
              : dt < since
                ? "This was before you began this plan. Your journey starts now, so make today count!"
                : r.single
                  ? "No session logged that day. This workout is open every day, so fit it in whenever you can!"
                  : pk([
                      "You missed this one, and that’s okay. Every champion has off days. What matters is the next one.",
                      "Missed workouts don’t define you; coming back does. Let’s make today count.",
                      "One skipped session won’t change you, but giving up will. Keep going!",
                    ]);
          return `<div class="card" style="border-color:${isT ? "var(--ac)" : "#7f1d1d"}">${hd}${ttl}<p>${isT ? "💪" : "🔥"} ${m}</p>${isT ? `<button class="btn" onclick="go('today')">Start workout →</button>` : ""}</div>`;
        }
        let n = 0;
        const rows = d.sections
          .map(
            (x) =>
              `<div class="sec" style="margin:12px 0 4px">${esc(x.n)}</div>` +
              x.items
                .map((it) => {
                  const nm = it.split("|")[0],
                    id = dn + "|" + nm + ++n,
                    l = wl[nm];
                  return `<div class="dr"><span>${esc(nm)}${l ? `<small>${esc(fmt(l))}</small>` : ""}</span><i>${l || tk.includes(id) ? "✓" : '<span class="mut">○</span>'}</i></div>`;
                })
                .join(""),
          )
          .join("");
        return `<div class="card" style="border-color:#22c55e55">${hd}${ttl}${d.note ? `<p class="mut">📝 ${esc(d.note)}</p>` : ""}${rows}</div>`;
      }

          ix = (n.getDay() + 6) % 7,
          td = iso(),
          since = S.get("fw_since", "") || (S.set("fw_since", td), td);

          const dt = iso(
              new Date(n.getFullYear(), n.getMonth(), n.getDate() - ix + i),

            rs = (r.days[x] || {}).rest,
            dn = dayDone(dt),
            c = dn
